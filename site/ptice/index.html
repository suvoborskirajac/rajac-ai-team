const grid = document.getElementById("bGrid");
const loadWrap = document.getElementById("loadWrap");
const loadBtn = document.getElementById("loadBtn");
const loadInfo = document.getElementById("loadInfo");
const countLine = document.getElementById("countLine");
const searchInput = document.getElementById("birdSearch");
const chips = Array.from(document.querySelectorAll(".chip"));
const seasonChips = Array.from(document.querySelectorAll(".seasonchip"));
const seasonNote = document.getElementById("seasonNote");

let currentFilter = "all";
let currentSeason = "all";
let currentSearch = "";
let visibleCount = 6;
const groupLabels = {
  vodene: "ВОДЕНЕ",
  grabljivice: "ГРАБЉИВИЦЕ",
  detlici: "ДЕТЛИЋИ",
  vrane: "ВРАНЕ",
  golubovi: "ГОЛУБОВИ",
  ostale: "ОСТАЛЕ",
  sove: "СОВЕ",
  pevacice: "ПЕВАЧИЦЕ"
};

function birdText(bird) {
  return [bird.name, bird.sci, bird.group, bird.blurb, ...(bird.pills || [])].join(" ").toLowerCase();
}

function isSpringSongMonth(month) {
  return month >= 2 && month <= 6;
}

function isNestingMonth(month) {
  return month >= 3 && month <= 7;
}

function matchesSeason(bird) {
  if (currentSeason === "all") return true;
  const text = birdText(bird);
  const month = new Date().getMonth();
  if (currentSeason === "resident") return text.includes("станарица");
  if (currentSeason === "migration") return text.includes("сеоб") || text.includes("пролаз");
  if (currentSeason === "nesting") return isNestingMonth(month) && (text.includes("гнезд") || text.includes("станарица") || text.includes("сеоб"));
  if (currentSeason === "singing") return isSpringSongMonth(month) && (bird.group === "pevacice" || bird.group === "detlici" || bird.group === "sove" || text.includes("кукавица"));
  return true;
}

function updateSeasonNote(itemsCount) {
  if (!seasonNote) return;
  const labels = {
    all: "Приказују се све сезонске групе. Изабери један сезонски филтер за брз теренски избор.",
    singing: "Пролећни избор: врсте које се у овом делу године најлакше откривају по песми или оглашавању.",
    nesting: "Гнездеће врсте: посматрати са дистанце, без приласка дупљама, гнездима и колонијама.",
    migration: "Сеоба и пролаз: врсте које су означене као сеобне, пролазнице или сезонски покретне.",
    resident: "Станарице: врсте које се могу пратити током целе године и добро служе за редован мониторинг."
  };
  seasonNote.textContent = `${labels[currentSeason] || labels.all} Тренутно у избору: ${itemsCount} врста.`;
}

function filteredBirds() {
  return birds.filter((bird) => {
    const byFilter = currentFilter === "all" || bird.group === currentFilter;
    const q = currentSearch.trim().toLowerCase();
    const bySearch = !q || birdText(bird).includes(q);
    return byFilter && matchesSeason(bird) && bySearch;
  });
}

function cardTemplate(bird, index) {
  const pills = bird.pills.map((pill) => `<span class="bird-card-pill">${pill}</span>`).join("");
  const badge = groupLabels[bird.group] || bird.group;
  const eager = index < 6;
  const loadAttrs = eager ? 'loading="eager" fetchpriority="high" decoding="async"' : 'loading="lazy" decoding="async"';
  const media = bird.img
    ? `<img src="${bird.img}" alt="${bird.name}" ${loadAttrs} onerror="if(this.dataset.tried){this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'bird-card-placeholder',textContent:'🪶'}));}else{this.dataset.tried=1;this.src='${bird.fallback||bird.img}';}">`
    : `<div class="bird-card-placeholder" aria-label="Фотографија није додата">🪶</div>`;
  return `
    <article class="bird-card">
      <a class="bird-card-media bird-card-media-link" href="${bird.url}" aria-label="Отвори страницу: ${bird.name}">
        ${media}
        <span class="bird-card-badge">${badge}</span>
      </a>
      <div class="bird-card-body">
        <h2 class="bird-card-title"><a href="${bird.url}">${bird.name}</a></h2>
        <p class="bird-card-sci">${bird.sci}</p>
        <p class="bird-card-copy">${bird.blurb}</p>
        <div class="bird-card-meta">${pills}</div>
        <a class="bird-card-link" href="${bird.url}">отвори страницу →</a>
      </div>
    </article>
  `;
}

function renderGrid() {
  const items = filteredBirds();
  const shown = items.slice(0, visibleCount);
  grid.innerHTML = shown.map(cardTemplate).join("");
  updateSeasonNote(items.length);

  countLine.textContent = items.length
    ? `Приказано ${shown.length} од ${items.length} врста у овом прегледу архиве.`
    : "Нема резултата за задату претрагу или филтер.";

  if (shown.length >= items.length || items.length === 0) {
    loadWrap.style.display = "none";
  } else {
    loadWrap.style.display = "flex";
    loadInfo.textContent = `Преостало још ${items.length - shown.length} врста за приказ.`;
  }
}

loadBtn.addEventListener("click", () => {
  visibleCount += 6;
  renderGrid();
});

if (searchInput) {
  searchInput.addEventListener("input", (event) => {
    currentSearch = event.target.value;
    visibleCount = 6;
    renderGrid();
  });
}

chips.forEach((chip) => {
  chip.addEventListener("click", () => {
    chips.forEach((item) => item.classList.remove("active"));
    chip.classList.add("active");
    currentFilter = chip.dataset.filter;
    visibleCount = 6;
    renderGrid();
  });
});

seasonChips.forEach((chip) => {
  chip.addEventListener("click", () => {
    seasonChips.forEach((item) => item.classList.remove("active"));
    chip.classList.add("active");
    currentSeason = chip.dataset.season || "all";
    visibleCount = 6;
    renderGrid();
  });
});

renderGrid();
</script>
