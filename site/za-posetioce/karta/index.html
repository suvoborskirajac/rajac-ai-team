<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#18232e;--text:#334451;--muted:#657482;--line:#dce4ea;--blue:#2563a7;--nav:#26301e;--sand:#e7cf85;--shadow:0 7px 24px rgba(20,40,60,.065);--navh:64px;--display:Georgia,"Times New Roman",serif;--body:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding-top:var(--navh);background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.62}a{color:inherit;text-decoration:none}
.book-nav{position:fixed;top:0;left:0;right:0;height:var(--navh);z-index:99999;background:rgba(38,48,30,.98);border-bottom:1px solid rgba(189,173,135,.45)}.book-nav .shell{width:min(1540px,calc(100% - 32px));height:100%;margin:auto;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}.book-nav .shell::-webkit-scrollbar{display:none}.nav-logo{height:42px;display:flex;align-items:center;gap:9px;padding-right:20px;margin-right:12px;border-right:1px solid rgba(255,255,255,.12);color:#fdf6e6;font-weight:700;white-space:nowrap}.nav-logo:before{content:"";width:9px;height:9px;border-radius:50%;background:#bdad87;box-shadow:0 0 0 4px rgba(189,173,135,.22)}.nav-links{display:flex;height:100%}.nav-link{height:42px;align-self:center;display:flex;align-items:center;padding:0 12px;border-bottom:2px solid transparent;color:rgba(253,246,230,.82);font-size:.68rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}.nav-link:hover{color:#fff;background:rgba(255,255,255,.04)}.nav-link.is-active{color:var(--sand);border-bottom-color:#bdad87}
.hero{background:#fff;border-bottom:1px solid var(--line)}.hero .inner{width:min(1540px,calc(100% - 32px));margin:auto;padding:27px 0 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}.kicker{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}h1{margin:4px 0 5px;font-family:var(--display);font-size:clamp(31px,3.2vw,46px);font-weight:500;line-height:1.05;color:var(--ink)}.hero p{max-width:1050px;margin:0;color:var(--muted)}.hero-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.pillbtn{display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#294b65;font-weight:750;font-size:13px}.pillbtn:hover{background:#edf2f6}.pillbtn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.main{width:min(1540px,calc(100% - 32px));margin:14px auto 40px}.map-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;overflow:hidden}#map{height:clamp(610px,76vh,920px);border-radius:10px;background:#dce5ea;overflow:hidden}.map-toolbar{display:none}.mode-btn{min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#294b65;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}.mode-btn:hover{background:#edf2f6}.mode-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}.map-note{margin-left:auto;align-self:center;color:var(--muted);font-size:12px}
#layerPanel{position:absolute;top:22px;right:22px;z-index:1000;width:292px;max-height:calc(100% - 92px);overflow:auto;padding:12px 13px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.13);backdrop-filter:blur(6px)}.lp-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:7px;color:#334451;font-weight:850;font-size:17px}.lp-sub{margin:10px 0 5px;font-size:10px;font-weight:850;letter-spacing:.10em;text-transform:uppercase;color:#778692}.layer-row{display:grid;grid-template-columns:17px 12px minmax(0,1fr) auto;align-items:center;gap:7px;padding:5px 0;font-size:12.5px;cursor:pointer}.layer-row input{margin:0}.sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}.cnt{font-variant-numeric:tabular-nums;color:#7c8993;font-size:11px}.range-row{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin-top:6px;font-size:11px;color:#697985}.range-row input{width:100%}.data-status{margin-top:10px;padding:8px 9px;border-radius:8px;background:#f0f6f1;border:1px solid #d7e7d9;color:#376146;font-size:11px;line-height:1.45}
#mapLegend{display:none;position:absolute;left:22px;bottom:22px;z-index:900;width:min(365px,calc(100% - 330px));max-height:46%;overflow:auto;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.95);box-shadow:0 5px 18px rgba(0,0,0,.13);font-size:12px;pointer-events:none}#mapLegend strong{display:block;margin:0 0 5px;color:#334451}.legend-section+ .legend-section{margin-top:9px;padding-top:8px;border-top:1px solid #e3e8e4}.lg{display:flex;align-items:center;gap:7px;margin:3px 0}.lg span{width:18px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}.lg.line span{height:0;border:0;border-top:3px solid;border-radius:0}.lg.dot span{width:10px;height:10px;border-radius:50%}
.info-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.info{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:17px 18px}.info h2{margin:0 0 7px;font-size:17px;color:var(--ink)}.info p{margin:0;color:var(--muted);font-size:13px;line-height:1.62}.downloads{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.downloads a{font-size:12px;font-weight:750;color:#294b65;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}.downloads a:hover{background:#edf2f6}
.leaflet-control-layers{border:1px solid var(--line)!important;box-shadow:0 4px 15px rgba(0,0,0,.12)!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#24333e}.leaflet-popup-content{font-family:var(--body);min-width:210px;max-width:330px}.pop-title{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1;color:#17232c;margin-bottom:4px}.pop-meta{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#71808c;margin-bottom:7px}.pop-text{font-size:12px;line-height:1.5;color:#556570;max-height:150px;overflow:auto}.tourist-kmz-icon{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.98)) drop-shadow(0 1.5px 3px rgba(0,0,0,.68));transition:transform .14s ease;transform-origin:50% 100%;cursor:pointer}.tourist-kmz-icon:hover{transform:scale(1.10)}.tourist-kmz-tooltip{background:rgba(255,255,255,.97)!important;border:1px solid #d5dde4!important;border-radius:7px!important;box-shadow:0 3px 10px rgba(0,0,0,.18)!important;color:#24333e!important;font-family:var(--body)!important;font-size:12px!important;font-weight:750!important;padding:5px 8px!important}.tourist-kmz-tooltip:before{display:none!important}

/* Симбологија преузета са изворних карата */
.karst-marker,.hydro-marker{background:transparent!important;border:0!important}
.karst-marker span,.hydro-marker span{display:block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.22)}
.karst-marker.sinkhole span{background:#e65100}.karst-marker.cave span{width:17px;height:17px;background:#795548;box-shadow:0 2px 12px rgba(0,0,0,.38),0 0 0 5px rgba(121,85,72,.18)}
.karst-marker.pit span{background:#5d4037}.karst-marker.ponor span{background:#0288d1}
.hydro-marker span{background:#0288d1}.hydro-marker.featured span{width:18px;height:18px;background:#004e9f;box-shadow:0 2px 12px rgba(0,0,0,.38),0 0 0 5px rgba(2,136,209,.22)}

/* Локација посетиоца — стално доступна на обе карте */
.leaflet-control.pio-location-control{margin:0 10px 24px 0!important}
.pio-location-btn{display:flex;align-items:center;gap:8px;min-height:42px;padding:9px 13px;border:1px solid rgba(28,67,97,.28);border-radius:9px;background:rgba(255,255,255,.96);color:#24465f;font:750 13px/1.15 var(--sans);box-shadow:0 1px 5px rgba(0,0,0,.18);cursor:pointer;white-space:nowrap}
.pio-location-btn:hover{background:#edf4f8}
.pio-location-btn:focus-visible{outline:3px solid rgba(38,112,179,.28);outline-offset:2px}
.pio-location-btn.is-on{background:#276fb4;color:#fff;border-color:#276fb4}
.pio-location-btn.is-busy{cursor:wait;opacity:.82}
.pio-location-dot{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(39,111,180,.16);flex:0 0 auto}
.pio-user-location-core{width:16px;height:16px;border-radius:50%;background:#1677d2;border:3px solid #fff;box-shadow:0 1px 7px rgba(0,0,0,.45)}
@media(max-width:680px){.leaflet-control.pio-location-control{margin:0 8px 26px 0!important}.pio-location-btn{min-height:44px;padding:9px 11px;font-size:12px}}
@media(max-width:980px){.hero .inner{grid-template-columns:1fr}.hero-actions{justify-content:flex-start}.info-row{grid-template-columns:1fr}#layerPanel{width:255px}#mapLegend{width:min(330px,calc(100% - 290px))}}@media(max-width:680px){:root{--navh:60px}body{font-size:15px}.book-nav .shell,.hero .inner,.main{width:min(100% - 20px,1540px)}.nav-link{padding:0 9px;font-size:.61rem}.hero .inner{padding:20px 0 17px}.hero-actions{display:none}.main{margin-top:10px}.map-card{padding:7px}#map{height:72vh;min-height:520px}.map-note{display:none}#layerPanel{top:14px;right:14px;width:224px;max-height:58%;padding:10px}#mapLegend{left:14px;bottom:14px;width:calc(100% - 252px);min-width:165px;max-height:38%;padding:8px 9px;font-size:10.5px}}
</style>

<body>
<nav class="book-nav" aria-label="Странице ПИО Рајац"><div class="shell"><a class="nav-logo" href="https://piorajac.rs/">ПИО „РАЈАЦ“</a><div class="nav-links"><a class="nav-link" href="https://piorajac.rs/o-platformi/">О платформи</a><a class="nav-link is-active" href="https://piorajac.rs/za-posetioce/">За посетиоце</a><a class="nav-link" href="https://piorajac.rs/za-istrazivace/">За истраживаче</a><a class="nav-link" href="https://piorajac.rs/za-vlasnike/">За власнике</a><a class="nav-link" href="https://piorajac.rs/aplikacije/">Апликације</a></div></div></nav>
<header class="hero"><div class="inner"><div><div class="kicker" id="heroKicker">Карта за посетиоце</div><h1 id="heroTitle">Карта ПИО „Рајац“</h1><p id="heroText"></p></div><div class="hero-actions" id="heroActions"></div></div></header>
<main class="main">
<section class="map-card">
  <div class="map-toolbar" id="toolbar"></div>
  <div id="map"></div>
  <aside id="layerPanel" aria-label="Слојеви карте"></aside>
  <div id="mapLegend"></div>
</section>
<div class="info-row" id="infoRow" style="display:none"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const FOCUS=new URLSearchParams(location.search).get('focus')==='tourist'?'tourist':'zone';
const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map',{zoomControl:true,scrollWheelZoom:true,preferCanvas:true}).setView([44.136333,20.224918],13);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
L.control.layers({'Сателит':satellite,'OpenStreetMap':osm},null,{collapsed:false,position:'topleft'}).addTo(map);
const panes={geo:340,pedo:350,z3:420,z2:421,z1:422,boundary:430,karst:500,hydro:520,tourist:550};Object.entries(panes).forEach(([n,z])=>{map.createPane(n);map.getPane(n).style.zIndex=z});
map.createPane('userLocation');map.getPane('userLocation').style.zIndex=700;
let zoneOpacity=.20;
const zoneLayers={boundary:L.geoJSON(null,{pane:'boundary',style:()=>({color:'#4f8a9e',weight:2.7,opacity:.98,fill:false,dashArray:'8 5'})}),zone1:L.geoJSON(null,{pane:'z1',style:()=>zoneStyle('I')}),zone2:L.geoJSON(null,{pane:'z2',style:()=>zoneStyle('II')}),zone3:L.geoJSON(null,{pane:'z3',style:()=>zoneStyle('III')})};
const natural={karst:null,geo:null,pedo:null,hydro:null};const naturalData={};let zonesData=null,touristData=null;
function zoneStyle(z){if(z==='I')return {color:'#d7191c',weight:1.7,opacity:.92,fillColor:'#d7191c',fillOpacity:zoneOpacity};if(z==='II')return {color:'#d98422',weight:1.4,opacity:.88,fillColor:'#fdae61',fillOpacity:Math.max(.05,zoneOpacity*.82)};return {color:'#1a7d3c',weight:1.35,opacity:.84,fillColor:'#1a9641',fillOpacity:Math.max(.04,zoneOpacity*.66)}}
function zoneKey(z){return z==='boundary'?'boundary':z==='I'?'zone1':z==='II'?'zone2':'zone3'}
function popup(title,meta,text){return '<div class="pop-title">'+safe(title)+'</div><div class="pop-meta">'+safe(meta||'')+'</div>'+(text?'<div class="pop-text">'+safe(text)+'</div>':'')}
function setLayer(layer,on){if(!layer)return;if(on){if(!map.hasLayer(layer))layer.addTo(map)}else if(map.hasLayer(layer))map.removeLayer(layer)}
let locationWatchId=null,locationMarker=null,locationAccuracy=null,locationFirstFix=true,locationBtn=null;
function locationButtonState(text,state){if(!locationBtn)return;locationBtn.querySelector('.pio-location-label').textContent=text;locationBtn.classList.toggle('is-on',state==='on');locationBtn.classList.toggle('is-busy',state==='busy');locationBtn.setAttribute('aria-pressed',state==='on'?'true':'false')}
function clearUserLocation(){if(locationWatchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null}if(locationMarker&&map.hasLayer(locationMarker))map.removeLayer(locationMarker);if(locationAccuracy&&map.hasLayer(locationAccuracy))map.removeLayer(locationAccuracy);locationMarker=null;locationAccuracy=null;locationFirstFix=true;locationButtonState('Укључи локацију','off')}
function locationError(err){console.warn('Geolocation:',err);if(locationWatchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null}let msg='Локација није доступна';if(err&&err.code===1)msg='Локација није дозвољена';else if(err&&err.code===2)msg='GPS сигнал није доступан';else if(err&&err.code===3)msg='GPS није одговорио';locationButtonState(msg,'off');setTimeout(()=>{if(locationWatchId===null&&!locationMarker)locationButtonState('Укључи локацију','off')},3500)}
function locationSuccess(pos){const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),acc=Math.max(0,Number(pos.coords.accuracy)||0);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const ll=L.latLng(lat,lng);if(!locationAccuracy){locationAccuracy=L.circle(ll,{pane:'userLocation',radius:acc,color:'#1677d2',weight:1.3,opacity:.7,fillColor:'#1677d2',fillOpacity:.10,interactive:false}).addTo(map)}else{locationAccuracy.setLatLng(ll).setRadius(acc)}if(!locationMarker){locationMarker=L.marker(ll,{pane:'userLocation',zIndexOffset:1000,icon:L.divIcon({className:'pio-user-location',html:'<div class="pio-user-location-core"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map)}else locationMarker.setLatLng(ll);locationMarker.bindPopup('<div class="pop-title">Ваша локација</div><div class="pop-meta">Тачност приближно ±'+Math.round(acc)+' m</div>');locationButtonState('Искључи локацију','on');if(locationFirstFix){locationFirstFix=false;map.flyTo(ll,Math.max(map.getZoom(),16),{duration:.8});locationMarker.openPopup()}}
function enableUserLocation(){if(!navigator.geolocation){locationButtonState('GPS није подржан','off');setTimeout(()=>locationButtonState('Укључи локацију','off'),3500);return}locationFirstFix=true;locationButtonState('Тражим локацију…','busy');locationWatchId=navigator.geolocation.watchPosition(locationSuccess,locationError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function toggleUserLocation(){if(locationWatchId!==null||locationMarker)clearUserLocation();else enableUserLocation()}
function addLocationControl(){const C=L.Control.extend({options:{position:'bottomright'},onAdd:function(){const wrap=L.DomUtil.create('div','leaflet-control pio-location-control');const btn=L.DomUtil.create('button','pio-location-btn',wrap);btn.type='button';btn.setAttribute('aria-label','Укључи приказ тренутне локације');btn.setAttribute('aria-pressed','false');btn.innerHTML='<span class="pio-location-dot" aria-hidden="true"></span><span class="pio-location-label">Укључи локацију</span>';locationBtn=btn;L.DomEvent.disableClickPropagation(wrap);L.DomEvent.disableScrollPropagation(wrap);L.DomEvent.on(btn,'click',L.DomEvent.stop).on(btn,'click',toggleUserLocation);return wrap}});map.addControl(new C())}
addLocationControl();
function fitPIO(){const b=zoneLayers.boundary.getBounds();if(b&&b.isValid())map.fitBounds(b.pad(.035));else map.setView([44.136333,20.224918],13)}
function swatch(color,label,type='box'){return '<div class="lg '+(type==='line'?'line':type==='dot'?'dot':'')+'"><span style="'+(type==='line'?'border-color:'+color:'background:'+color)+'"></span>'+safe(label)+'</div>'}
function legendSection(title,rows){return '<div class="legend-section"><strong>'+safe(title)+'</strong>'+rows.join('')+'</div>'}
function layerIsOn(key){const layer=natural[key];return !!(layer&&map.hasLayer(layer))}
function updateZoneLegend(){let html='';
 if(layerIsOn('karst'))html+=legendSection('Карстни рељеф',[swatch('#d95f0e','Вртаче','dot'),swatch('#795548','Пећине','dot'),swatch('#5d4037','Јаме','dot'),swatch('#0288d1','Понори','dot'),swatch('#795548','Карстне увале','line'),swatch('#e65100','Скрашћене долине')]);
 if(layerIsOn('geo')&&naturalData.geo){const seen=new Map();naturalData.geo.features.forEach(f=>{const p=f.properties||{},n=p.name||'';if(!n||/границ/i.test(n)||n==='Расед')return;if(!seen.has(n))seen.set(n,p.fill||p.stroke||'#777')});html+=legendSection('Геолошка карта',[...seen].map(([n,c])=>swatch(c,n)).concat([swatch('#e65100','Раседи','line')]))}
 if(layerIsOn('pedo')&&naturalData.pedo){const seen=new Map();naturalData.pedo.features.forEach(f=>{const p=f.properties||{},n=p.category||'';if(!n||/ПИО РАЈАЦ/i.test(n))return;if(!seen.has(n))seen.set(n,p.fill||p.stroke||'#777')});html+=legendSection('Педолошка карта',[...seen].map(([n,c])=>swatch(c,n)))}
 if(layerIsOn('hydro'))html+=legendSection('Хидрографија',[swatch('#004e9f','Извор / чесма','dot'),swatch('#0288d1','Повремени или стални водоток','line')]);
 const el=$('#mapLegend');el.innerHTML=html;el.style.display=html?'block':'none'}
async function fetchJSON(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error(url+' '+r.status);return r.json()}
async function loadZones(){zonesData=await fetchJSON('data/pio-rajac-granica-zone-web.geojson');zonesData.features.forEach(ft=>{const p=ft.properties||{},k=zoneKey(p.zone);if(zoneLayers[k])zoneLayers[k].addData(ft).bindPopup(popup(p.name||'Зона заштите',p.zone==='boundary'?'Граница ПИО':p.zone+' степен заштите','Локални слој границе и режима заштите ПИО „Рајац“.'))});['zone3','zone2','zone1','boundary'].forEach(k=>zoneLayers[k].addTo(map));fitPIO();updateZoneLegend()}
function karstStyle(f){const c=(f.properties||{}).category;if(c==='boundary')return {pane:'karst',color:'#006064',weight:2.6,opacity:.96,fill:false,dashArray:'8 6'};if(c==='karst_valley')return {pane:'karst',color:'#e65100',weight:1.8,opacity:.85,fillColor:'#e65100',fillOpacity:.16};if(c==='uvala')return {pane:'karst',color:'#795548',weight:4.2,opacity:.9,lineCap:'round',lineJoin:'round',dashArray:'10 6'};return {pane:'karst',color:'#795548',weight:2.2,opacity:.8,fillOpacity:.12}}
function karstPoint(f,ll){const c=(f.properties||{}).category||'other',size=c==='cave'?[17,17]:[14,14];return L.marker(ll,{pane:'karst',icon:L.divIcon({className:'karst-marker '+c,html:'<span></span>',iconSize:size,iconAnchor:[size[0]/2,size[1]/2],popupAnchor:[0,-8]})})}
async function ensureKarst(){if(natural.karst)return natural.karst;const data=await fetchJSON('/rajac-static-2105/assets/page-assets/reljef/karstni-reljef.geojson');naturalData.karst=data;natural.karst=L.geoJSON(data,{pane:'karst',filter:f=>!/^boundary$/i.test((f.properties||{}).category||''),style:karstStyle,pointToLayer:karstPoint,onEachFeature:(f,l)=>{const p=f.properties||{};l.bindPopup(popup(p.name||p.category_label||'Карстни елемент','Карстни рељеф',p.description||''));if(p.name&&p.name!=='Вртача')l.bindTooltip(p.name,{sticky:true})}});return natural.karst}
async function ensureGeo(){if(natural.geo)return natural.geo;const data=await fetchJSON('data/geoloska-karta-pio-rajac.geojson');naturalData.geo=data;natural.geo=L.geoJSON(data,{pane:'geo',filter:f=>!/границ/i.test((f.properties||{}).name||''),style:f=>{const p=f.properties||{};if(p.name==='Расед')return {pane:'geo',color:p.stroke||'#e65100',weight:Number(p.weight)||1.2,opacity:p.strokeOpacity==null?1:Number(p.strokeOpacity)};return {pane:'geo',color:p.stroke||p.fill||'#777',weight:Number(p.weight)||1.2,opacity:p.strokeOpacity==null?1:Number(p.strokeOpacity),fillColor:p.fill||'#999',fillOpacity:p.fillOpacity==null?.55:Number(p.fillOpacity)}},onEachFeature:(f,l)=>{const p=f.properties||{};l.bindPopup(popup(p.name||'Геолошка јединица',p.category||'Геологија',String(p.description||'').replace(/^опис:\s*/i,'').slice(0,700)))}});return natural.geo}
async function ensurePedo(){if(natural.pedo)return natural.pedo;const data=await fetchJSON('data/pedoloska-karta-pio-rajac.geojson');naturalData.pedo=data;natural.pedo=L.geoJSON(data,{pane:'pedo',filter:f=>!/границ/i.test((f.properties||{}).name||''),style:f=>{const p=f.properties||{};return {pane:'pedo',color:p.stroke||p.fill||'#777',weight:Number(p.weight)||1.2,opacity:p.strokeOpacity==null?1:Number(p.strokeOpacity),fillColor:p.fill||'#999',fillOpacity:p.fillOpacity==null?.55:Number(p.fillOpacity)}},onEachFeature:(f,l)=>{const p=f.properties||{};l.bindPopup(popup(p.category||'Тип земљишта','Педологија','Тип земљишта на подручју ПИО „Рајац“.'))}});return natural.pedo}
async function ensureHydro(){if(natural.hydro)return natural.hydro;const data=await fetchJSON('/rajac-static-2105/assets/page-assets/hidrografija/izvori-na-rajcu.geojson');naturalData.hydro=data;natural.hydro=L.geoJSON(data,{pane:'hydro',filter:f=>{const c=(f.properties||{}).category||'';return c==='featured_source'||c==='source'||c==='watercourse'},style:f=>{const c=(f.properties||{}).category||'';if(c==='watercourse')return {pane:'hydro',color:'#0288d1',weight:4.2,opacity:.9,lineCap:'round',lineJoin:'round'};return {pane:'hydro',color:'#0288d1',weight:1.2,opacity:.9,fillOpacity:.12}},pointToLayer:(f,ll)=>{const c=(f.properties||{}).category||'',featured=c==='featured_source',size=featured?[18,18]:[14,14];return L.marker(ll,{pane:'hydro',icon:L.divIcon({className:'hydro-marker '+(featured?'featured':''),html:'<span></span>',iconSize:size,iconAnchor:[size[0]/2,size[1]/2],popupAnchor:[0,-8]})})},onEachFeature:(f,l)=>{const p=f.properties||{},c=p.category||'';const label=c==='watercourse'?'Повремени или стални водоток':'Извор / чесма';l.bindPopup(popup(p.name||label,'Хидрографија',p.description||''));if(p.name)l.bindTooltip(p.name,{sticky:true})}});return natural.hydro}
function refreshZoneStylesForThemes(){const anyTheme=Object.values(natural).some(l=>l&&map.hasLayer(l));const effective=anyTheme?Math.min(zoneOpacity,.07):zoneOpacity;['zone1','zone2','zone3'].forEach(k=>zoneLayers[k].setStyle(f=>{const z=(f.properties||{}).zone;if(z==='I')return {color:'#d7191c',weight:1.7,opacity:.92,fillColor:'#d7191c',fillOpacity:effective};if(z==='II')return {color:'#d98422',weight:1.4,opacity:.88,fillColor:'#fdae61',fillOpacity:Math.max(.03,effective*.82)};return {color:'#1a7d3c',weight:1.35,opacity:.84,fillColor:'#1a9641',fillOpacity:Math.max(.025,effective*.66)}}))}
function updateNaturalIndicator(key,on){const cb=document.querySelector('[data-natural="'+key+'"]');if(!cb)return;const row=cb.closest('.layer-row');const cnt=row&&row.querySelector('.cnt');if(cnt)cnt.textContent=on?'●':'○'}
async function toggleNatural(key,on,cb){const status=$('#naturalStatus');try{if(cb)cb.disabled=true;if(on){status.textContent='Учитавање слоја…';const layer=key==='karst'?await ensureKarst():key==='geo'?await ensureGeo():key==='pedo'?await ensurePedo():await ensureHydro();setLayer(layer,true);updateNaturalIndicator(key,true);status.textContent='Слој је укључен. Легенда је приказана лево доле.'}else{setLayer(natural[key],false);updateNaturalIndicator(key,false);status.textContent='Слој је искључен.'}refreshZoneStylesForThemes();updateZoneLegend()}catch(e){console.error(e);setLayer(natural[key],false);if(cb)cb.checked=false;updateNaturalIndicator(key,false);refreshZoneStylesForThemes();updateZoneLegend();status.textContent='Слој није могао да се учита и уклоњен је са карте.'}finally{if(cb)cb.disabled=false}}
function renderZoneUI(){
 document.title='Граница, зоне и природна основа | ПИО Рајац';
 $('#heroTitle').textContent='Граница, зоне и природна основа Рајца';
 $('#heroText').textContent='Основни приказ су граница ПИО „Рајац“ и I, II и III степен заштите. Карстни рељеф, геолошку, педолошку и хидрографску карту укључујете по потреби преко исте карте и исте подлоге.';
 $('#heroActions').innerHTML='<a class="pillbtn" href="../">← За посетиоце</a><a class="pillbtn primary" href="?focus=tourist">Туристичка карта →</a>';
 $('#toolbar').innerHTML='';
 $('#layerPanel').innerHTML='<div class="lp-title"><span>Слојеви карте</span><span>☰</span></div><div class="lp-sub">Заштита</div>'+[['boundary','#4f8a9e','Граница ПИО','1'],['zone1','#d7191c','I степен','1'],['zone2','#fdae61','II степен','3'],['zone3','#1a9641','III степен','1']].map(x=>'<label class="layer-row"><input type="checkbox" checked data-zone="'+x[0]+'"><span class="sw" style="background:'+x[1]+'"></span><span>'+x[2]+'</span><span class="cnt">'+x[3]+'</span></label>').join('')+'<div class="range-row"><span>Провидност зона</span><input type="range" id="zoneOpacity" min="5" max="45" value="20"></div><div class="lp-sub">Природна основа</div>'+[['karst','#795548','Карстни рељеф'],['geo','#826f55','Геолошка карта'],['pedo','#8a6b45','Педолошка карта'],['hydro','#0288d1','Хидрографија']].map(x=>'<label class="layer-row"><input type="checkbox" data-natural="'+x[0]+'"><span class="sw" style="background:'+x[1]+'"></span><span>'+x[2]+'</span><span class="cnt">○</span></label>').join('')+'<div class="data-status" id="naturalStatus">При учитавању су активни само граница ПИО и зоне заштите. Тематски слојеви се укључују искључиво чекирањем овде; њихова легенда се појављује лево доле.</div>';
 $('#infoRow').innerHTML='';$('#infoRow').style.display='none';
 document.querySelectorAll('[data-zone]').forEach(cb=>cb.addEventListener('change',()=>{setLayer(zoneLayers[cb.dataset.zone],cb.checked);updateZoneLegend()}));
 document.querySelectorAll('[data-natural]').forEach(cb=>cb.addEventListener('change',()=>toggleNatural(cb.dataset.natural,cb.checked,cb)));
 $('#zoneOpacity').addEventListener('input',e=>{zoneOpacity=Number(e.target.value)/100;refreshZoneStylesForThemes()});
 loadZones().catch(e=>{console.error(e);$('#naturalStatus').textContent='Локални слој зона није учитан.'});
}
const touristColors={'АТРАКЦИЈЕ':'#6e8c55','ИНФРАСТРУКТУРА':'#4f8a9e','СМЕШТАЈ':'#86a64e','ОКОЛИНА':'#b3703f'};const touristGroups={};
function touristIcon(p){const sw=Number(p.icon_w)||42,sh=Number(p.icon_h)||42,scale=Math.min(1,28/Math.max(sw,sh)),w=Math.max(22,Math.round(sw*scale)),h=Math.max(22,Math.round(sh*scale));return L.icon({iconUrl:p.icon_url,iconSize:[w,h],iconAnchor:[Math.round(w/2),h],popupAnchor:[0,-Math.round(h*.72)],className:'tourist-kmz-icon'})}
async function renderTouristUI(){document.title='Туристичка карта Рајца | ПИО Рајац';$('#heroTitle').textContent='Туристичка карта Рајца';$('#heroText').textContent='Атракције, инфраструктура, смештај и садржаји у околини приказани су оригиналним пиктограмским иконама из достављене туристичке карте.';$('#heroActions').innerHTML='<a class="pillbtn" href="../">← За посетиоце</a><a class="pillbtn primary" href="?focus=zone">Природна основа →</a>';$('#toolbar').innerHTML='';$('#layerPanel').innerHTML='<div class="lp-title"><span>Туристички садржаји</span><span>☰</span></div><div class="lp-sub">Категорије</div>'+Object.entries(touristColors).map(([g,c])=>'<label class="layer-row"><input type="checkbox" checked data-group="'+g+'"><span class="sw" style="background:'+c+'"></span><span>'+safe(g.charAt(0)+g.slice(1).toLowerCase())+'</span><span class="cnt"></span></label>').join('')+'<div class="data-status">Ово је засебна туристичка карта. Зоне и природна основа налазе се у другом приказу.</div>';$('#mapLegend').style.display='none';$('#infoRow').innerHTML='';$('#infoRow').style.display='none';touristData=await fetchJSON('data/turisticka-karta-rajca.geojson');Object.keys(touristColors).forEach(k=>touristGroups[k]=L.layerGroup().addTo(map));touristData.features.forEach(ft=>{const p=ft.properties||{},g=touristGroups[p.group]||touristGroups['АТРАКЦИЈЕ'];const layer=L.geoJSON(ft,{pane:'tourist',pointToLayer:(f,ll)=>p.icon_url?L.marker(ll,{icon:touristIcon(p),riseOnHover:true}):L.circleMarker(ll,{pane:'tourist',radius:6,color:'#fff',weight:1.5,fillColor:touristColors[p.group]||'#6e8c55',fillOpacity:1}),style:()=>({pane:'tourist',color:touristColors[p.group]||'#6e8c55',weight:2,fillOpacity:.12}),onEachFeature:(f,l)=>{l.bindPopup(popup(p.name||'Локација',p.group||'',p.description_text||''));if(f.geometry&&f.geometry.type==='Point')l.bindTooltip(p.name||'Локација',{direction:'top',offset:[0,-15],className:'tourist-kmz-tooltip'})}});g.addLayer(layer)});const b=L.geoJSON(touristData).getBounds();if(b.isValid())map.fitBounds(b.pad(.05));document.querySelectorAll('[data-group]').forEach(cb=>cb.addEventListener('change',()=>setLayer(touristGroups[cb.dataset.group],cb.checked)));}
if(FOCUS==='tourist')renderTouristUI().catch(console.error);else renderZoneUI();setTimeout(()=>map.invalidateSize(),150);
})();
</script>
