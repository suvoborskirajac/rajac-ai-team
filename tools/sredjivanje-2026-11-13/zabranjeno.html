<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Немате право приступа | ПИО „Рајац“</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#13233f; --gold:#b8913a; --cream:#f7f2e7; --ink:#24324a; --muted:#5d6878; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { min-height:100vh; display:flex; flex-direction:column; background:var(--cream); color:var(--ink); font-family:"DM Sans", system-ui, sans-serif; }
  .traka { background:var(--navy); padding:14px 22px; }
  .traka a { color:#fff; text-decoration:none; font-weight:700; letter-spacing:.08em; font-size:14px; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .kartica { max-width:560px; width:100%; background:#fff; border:1px solid #e6dcc6; border-top:4px solid var(--gold); border-radius:14px; padding:38px 34px; text-align:center; box-shadow:0 10px 30px rgba(19,35,63,.08); }
  .znak { width:58px; height:58px; margin:0 auto 18px; border-radius:50%; background:var(--cream); border:1px solid #e6dcc6; display:flex; align-items:center; justify-content:center; }
  h1 { font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; color:var(--navy); font-size:34px; line-height:1.15; margin:0 0 14px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 12px; font-size:16px; }
  .dugmad { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .dugme { display:inline-block; padding:11px 22px; border-radius:999px; text-decoration:none; font-weight:700; font-size:15px; }
  .glavno { background:var(--navy); color:#fff; }
  .sporedno { border:1px solid var(--navy); color:var(--navy); }
  footer { text-align:center; font-size:13px; color:var(--muted); padding:18px; }
  @media (max-width:430px) { .kartica { padding:30px 22px; } h1 { font-size:28px; } }
</style>
</head>
<body>
<div class="traka"><a href="https://piorajac.rs/">ПИО „РАЈАЦ“</a></div>
<main>
  <div class="kartica">
    <div class="znak" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#13233f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1>Немате право приступа овој страници</h1>
    <p>Ова страница или фајл нису јавно доступни.</p>
    <p>Ако мислите да је ово грешка, пишите нам на <a href="mailto:office@piorajac.rs" style="color:inherit">office@piorajac.rs</a>.</p>
    <div class="dugmad">
      <a class="dugme glavno" href="https://piorajac.rs/">Почетна страница</a>
    </div>
  </div>
</main>
<footer>Предео изузетних одлика „Рајац“ · <a href="mailto:office@piorajac.rs" style="color:inherit">office@piorajac.rs</a></footer>
</body>
</html>
